<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 235" width="100%" height="100%" class="arch-svg-diagram" style="display: block; width: 100%; height: 100%;">
  <defs>
    <!-- Background Dot Matrix Grid -->
    <pattern id="arch-grid-pattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="rgba(255, 255, 255, 0.07)" />
    </pattern>

    <!-- Center Ambient Glow -->
    <radialGradient id="arch-glow" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Node Surface Gradients -->
    <linearGradient id="node-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <linearGradient id="client-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.04)" />
    </linearGradient>

    <!-- Animated Data Flow Gradients -->
    <linearGradient id="stream-static" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.3)" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.4)" />
    </linearGradient>

    <linearGradient id="stream-telemetry" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.3)" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.4)" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arch-arrow-static" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0.5 L 5 3 L 0 5.5 Z" fill="#38bdf8" />
    </marker>
    <marker id="arch-arrow-telemetry" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0.5 L 5 3 L 0 5.5 Z" fill="#fb923c" />
    </marker>

    <!-- Node Shadow -->
    <filter id="tile-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes archDash {
        from { stroke-dashoffset: 20; }
        to { stroke-dashoffset: 0; }
      }
      .arch-stream-static {
        stroke-dasharray: 5 4;
        animation: archDash 1.2s linear infinite;
      }
      .arch-stream-telemetry {
        stroke-dasharray: 5 4;
        animation: archDash 1.2s linear infinite;
      }
      .arch-node {
        transition: transform 0.2s ease, filter 0.2s ease;
      }
      .arch-node:hover {
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
      }
    </style>
  </defs>

  <!-- Background Base Canvas (Rendered via full-bleed container for 100% viewport coverage) -->

  <!-- Top Clearance Zone: Y=0..58 open for floating badges -->

  <!-- Lane Indicators (Shifted down for generous breathing room) -->
  <g opacity="0.8">
    <text x="146" y="66" fill="rgba(255, 255, 255, 0.4)" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" letter-spacing="0.1em">STATIC EDGE DELIVERY LAYER</text>
    <text x="146" y="148" fill="rgba(255, 255, 255, 0.4)" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" letter-spacing="0.1em">SERVERLESS TELEMETRY PIPELINE</text>
    <line x1="146" y1="138" x2="608" y2="138" stroke="rgba(255, 255, 255, 0.05)" stroke-dasharray="2 3" />
  </g>

  <!-- ═════════ CONNECTIONS (UNDER NODES) ═════════ -->
  <g fill="none">
    <!-- Static Track 1: Client -> Route 53 -->
    <path d="M 104 124 C 124 124, 126 95, 146 95" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <path d="M 104 124 C 124 124, 126 95, 146 95" stroke="url(#stream-static)" stroke-width="1.5" class="arch-stream-static" marker-end="url(#arch-arrow-static)" />

    <!-- Static Track 2: Route 53 -> CloudFront -->
    <path d="M 260 95 L 318 95" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <path d="M 260 95 L 318 95" stroke="url(#stream-static)" stroke-width="1.5" class="arch-stream-static" marker-end="url(#arch-arrow-static)" />

    <!-- Static Track 3: CloudFront -> S3 Bucket -->
    <path d="M 436 95 L 494 95" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <path d="M 436 95 L 494 95" stroke="url(#stream-static)" stroke-width="1.5" class="arch-stream-static" marker-end="url(#arch-arrow-static)" />

    <!-- Telemetry Track 1: Client -> API Gateway -->
    <path d="M 104 146 C 124 146, 126 177, 146 177" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <path d="M 104 146 C 124 146, 126 177, 146 177" stroke="url(#stream-telemetry)" stroke-width="1.5" class="arch-stream-telemetry" marker-end="url(#arch-arrow-telemetry)" />

    <!-- Telemetry Track 2: API Gateway -> Lambda -->
    <path d="M 260 177 L 318 177" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <path d="M 260 177 L 318 177" stroke="url(#stream-telemetry)" stroke-width="1.5" class="arch-stream-telemetry" marker-end="url(#arch-arrow-telemetry)" />

    <!-- Telemetry Track 3: Lambda -> DynamoDB -->
    <path d="M 436 177 L 494 177" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    <path d="M 436 177 L 494 177" stroke="url(#stream-telemetry)" stroke-width="1.5" class="arch-stream-telemetry" marker-end="url(#arch-arrow-telemetry)" />
  </g>

  <!-- Protocol Pills on Connectors -->
  <g font-family="'JetBrains Mono', monospace" font-size="7" font-weight="600">
    <!-- DNS Query -->
    <rect x="271" y="88" width="36" height="14" rx="3" fill="#08090d" stroke="rgba(255, 255, 255, 0.18)" />
    <text x="289" y="98" fill="rgba(255, 255, 255, 0.75)" text-anchor="middle">HTTPS</text>

    <!-- OAC SigV4 -->
    <rect x="447" y="88" width="36" height="14" rx="3" fill="#08090d" stroke="rgba(255, 255, 255, 0.18)" />
    <text x="465" y="98" fill="#38bdf8" text-anchor="middle">OAC</text>

    <!-- CORS -->
    <rect x="271" y="170" width="36" height="14" rx="3" fill="#08090d" stroke="rgba(255, 255, 255, 0.18)" />
    <text x="289" y="180" fill="rgba(255, 255, 255, 0.75)" text-anchor="middle">CORS</text>

    <!-- Atomic +1 -->
    <rect x="446" y="170" width="38" height="14" rx="3" fill="#08090d" stroke="rgba(255, 255, 255, 0.18)" />
    <text x="465" y="180" fill="#fb923c" text-anchor="middle">+1 ADD</text>
  </g>

  <!-- ═════════ NODES ═════════ -->

  <!-- NODE 0: CLIENT / VISITOR (Left Hub) -->
  <g class="arch-node" transform="translate(20, 112)" filter="url(#tile-shadow)">
    <rect width="84" height="46" rx="8" fill="url(#client-bg)" stroke="rgba(255, 255, 255, 0.18)" />
    <line x1="8" y1="0.5" x2="76" y2="0.5" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1" />
    
    <!-- User/Browser Icon -->
    <g transform="translate(10, 13)">
      <rect x="0" y="0" width="18" height="12" rx="2" fill="none" stroke="#ffffff" stroke-width="1.3" />
      <line x1="0" y1="3.5" x2="18" y2="3.5" stroke="rgba(255, 255, 255, 0.35)" stroke-width="0.8" />
      <circle cx="3" cy="1.8" r="0.6" fill="#38bdf8" />
      <circle cx="5.5" cy="1.8" r="0.6" fill="rgba(255, 255, 255, 0.6)" />
      <line x1="5" y1="15" x2="13" y2="15" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" />
      <line x1="9" y1="12" x2="9" y2="15" stroke="#ffffff" stroke-width="1.2" />
    </g>
    
    <text x="35" y="22" fill="#ffffff" font-family="'Syne', -apple-system, sans-serif" font-size="10.5" font-weight="700">Visitor</text>
    <text x="35" y="33" fill="rgba(255, 255, 255, 0.5)" font-family="'JetBrains Mono', monospace" font-size="7">Browser/JS</text>
  </g>

  <!-- NODE 1: ROUTE 53 -->
  <g class="arch-node" transform="translate(146, 74)" filter="url(#tile-shadow)">
    <rect width="114" height="42" rx="8" fill="url(#node-bg)" stroke="rgba(255, 255, 255, 0.14)" />
    <line x1="8" y1="0.5" x2="106" y2="0.5" stroke="rgba(255, 255, 255, 0.28)" stroke-width="1" />
    
    <!-- Route 53 Globe with Route Arrows -->
    <g transform="translate(11, 12)">
      <circle cx="9" cy="9" r="8" fill="none" stroke="#a78bfa" stroke-width="1.3" />
      <ellipse cx="9" cy="9" rx="3.5" ry="8" fill="none" stroke="rgba(167, 139, 250, 0.6)" stroke-width="1" />
      <line x1="1" y1="9" x2="17" y2="9" stroke="rgba(167, 139, 250, 0.6)" stroke-width="1" />
      <circle cx="4" cy="5" r="1" fill="#a78bfa" />
      <circle cx="14" cy="13" r="1" fill="#a78bfa" />
    </g>
    
    <text x="36" y="20" fill="#ffffff" font-family="'Syne', -apple-system, sans-serif" font-size="10.5" font-weight="700">Route 53</text>
    <text x="36" y="31" fill="rgba(255, 255, 255, 0.5)" font-family="'JetBrains Mono', monospace" font-size="7.5">Anycast DNS</text>
  </g>

  <!-- NODE 2: CLOUDFRONT -->
  <g class="arch-node" transform="translate(318, 74)" filter="url(#tile-shadow)">
    <rect width="118" height="42" rx="8" fill="url(#node-bg)" stroke="rgba(255, 255, 255, 0.14)" />
    <line x1="8" y1="0.5" x2="110" y2="0.5" stroke="rgba(255, 255, 255, 0.28)" stroke-width="1" />
    
    <!-- CloudFront Edge Shield & Lightning -->
    <g transform="translate(11, 11)">
      <path d="M 9 1 L 16 3.5 L 16 9 C 16 13.5 9 16.5 9 16.5 C 9 16.5 2 13.5 2 9 L 2 3.5 Z" fill="none" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1" />
      <path d="M 10 3 L 5 9.5 L 9 9.5 L 8 14.5 L 13 8 L 9.5 8 Z" fill="#38bdf8" />
    </g>
    
    <text x="35" y="20" fill="#ffffff" font-family="'Syne', -apple-system, sans-serif" font-size="10.5" font-weight="700">CloudFront</text>
    <text x="35" y="31" fill="rgba(255, 255, 255, 0.5)" font-family="'JetBrains Mono', monospace" font-size="7.5">Edge CDN · TLS</text>
  </g>

  <!-- NODE 3: S3 ORIGIN -->
  <g class="arch-node" transform="translate(494, 74)" filter="url(#tile-shadow)">
    <rect width="114" height="42" rx="8" fill="url(#node-bg)" stroke="rgba(255, 255, 255, 0.14)" />
    <line x1="8" y1="0.5" x2="106" y2="0.5" stroke="rgba(255, 255, 255, 0.28)" stroke-width="1" />
    
    <!-- S3 Bucket Icon -->
    <g transform="translate(13, 11)">
      <ellipse cx="8" cy="4" rx="7" ry="2.5" fill="none" stroke="#34d399" stroke-width="1.3" />
      <path d="M 1 4 L 1 12 C 1 14 15 14 15 12 L 15 4" fill="none" stroke="#34d399" stroke-width="1.3" />
      <path d="M 1 8 C 1 10 15 10 15 8" fill="none" stroke="rgba(52, 211, 153, 0.5)" stroke-width="1" />
    </g>
    
    <text x="35" y="20" fill="#ffffff" font-family="'Syne', -apple-system, sans-serif" font-size="10.5" font-weight="700">S3 Origin</text>
    <text x="35" y="31" fill="rgba(255, 255, 255, 0.5)" font-family="'JetBrains Mono', monospace" font-size="7.5">Private Bucket</text>
  </g>

  <!-- NODE 4: API GATEWAY -->
  <g class="arch-node" transform="translate(146, 156)" filter="url(#tile-shadow)">
    <rect width="114" height="42" rx="8" fill="url(#node-bg)" stroke="rgba(255, 255, 255, 0.14)" />
    <line x1="8" y1="0.5" x2="106" y2="0.5" stroke="rgba(255, 255, 255, 0.28)" stroke-width="1" />
    
    <!-- API Gateway Hex Icon -->
    <g transform="translate(12, 11)">
      <polygon points="9,1 16,5 16,13 9,17 2,13 2,5" fill="none" stroke="#fb7185" stroke-width="1.3" />
      <circle cx="9" cy="9" r="2.5" fill="none" stroke="#fb7185" stroke-width="1" />
      <line x1="9" y1="1" x2="9" y2="6.5" stroke="rgba(251, 113, 133, 0.5)" stroke-width="1" />
      <line x1="9" y1="11.5" x2="9" y2="17" stroke="rgba(251, 113, 133, 0.5)" stroke-width="1" />
    </g>
    
    <text x="36" y="20" fill="#ffffff" font-family="'Syne', -apple-system, sans-serif" font-size="10.5" font-weight="700">API Gateway</text>
    <text x="36" y="31" fill="rgba(255, 255, 255, 0.5)" font-family="'JetBrains Mono', monospace" font-size="7.5">REST Endpoint</text>
  </g>

  <!-- NODE 5: AWS LAMBDA -->
  <g class="arch-node" transform="translate(318, 156)" filter="url(#tile-shadow)">
    <rect width="118" height="42" rx="8" fill="url(#node-bg)" stroke="rgba(255, 255, 255, 0.14)" />
    <line x1="8" y1="0.5" x2="110" y2="0.5" stroke="rgba(255, 255, 255, 0.28)" stroke-width="1" />
    
    <!-- Lambda Vector Symbol -->
    <g transform="translate(13, 11)">
      <rect x="0" y="0" width="16" height="16" rx="3" fill="none" stroke="rgba(251, 146, 60, 0.4)" stroke-width="1" />
      <path d="M 4 13 L 8.5 4 M 6.5 8.5 L 12 13" stroke="#fb923c" stroke-width="1.6" stroke-linecap="round" fill="none" />
    </g>
    
    <text x="36" y="20" fill="#ffffff" font-family="'Syne', -apple-system, sans-serif" font-size="10.5" font-weight="700">AWS Lambda</text>
    <text x="36" y="31" fill="rgba(255, 255, 255, 0.5)" font-family="'JetBrains Mono', monospace" font-size="7.5">Python 3.12</text>
  </g>

  <!-- NODE 6: DYNAMODB -->
  <g class="arch-node" transform="translate(494, 156)" filter="url(#tile-shadow)">
    <rect width="114" height="42" rx="8" fill="url(#node-bg)" stroke="rgba(255, 255, 255, 0.14)" />
    <line x1="8" y1="0.5" x2="106" y2="0.5" stroke="rgba(255, 255, 255, 0.28)" stroke-width="1" />
    
    <!-- DynamoDB Icon -->
    <g transform="translate(13, 11)">
      <ellipse cx="8" cy="3" rx="7" ry="2.2" fill="none" stroke="#60a5fa" stroke-width="1.3" />
      <path d="M 1 3 L 1 7 C 1 8.5 15 8.5 15 7 L 15 3" fill="none" stroke="#60a5fa" stroke-width="1.3" />
      <path d="M 1 7 L 1 11 C 1 12.5 15 12.5 15 11 L 15 7" fill="none" stroke="#60a5fa" stroke-width="1.3" />
      <path d="M 1 11 L 1 15 C 1 16.5 15 16.5 15 15 L 15 11" fill="none" stroke="#60a5fa" stroke-width="1.3" />
    </g>
    
    <text x="35" y="20" fill="#ffffff" font-family="'Syne', -apple-system, sans-serif" font-size="10.5" font-weight="700">DynamoDB</text>
    <text x="35" y="31" fill="rgba(255, 255, 255, 0.5)" font-family="'JetBrains Mono', monospace" font-size="7.5">Atomic Counter</text>
  </g>
</svg>